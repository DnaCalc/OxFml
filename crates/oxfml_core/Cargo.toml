[package]
name = "oxfml_core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lints]
workspace = true

[lib]
name = "oxfml_core"
path = "src/lib.rs"

[features]
# Exposes the test-only A1 grid reference profile/provider
# (oxfml_core::test_support::grid) to external test crates. Off in production
# builds so core ships no built-in reference grammar.
test-support = []

[dependencies]
oxfunc_core = { path = "../../../OxFunc/crates/oxfunc_core" }
serde_json = "1"
stacker = "0.1"

[dev-dependencies]
# Self-reference enabling test-support so integration tests link the test-only
# grid reference profile/provider and the cfg-gated runtime default.
oxfml_core = { path = ".", features = ["test-support"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
